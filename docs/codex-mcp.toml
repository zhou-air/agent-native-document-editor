# 替换以下两处绝对路径。解压后的 resources/app.asar 不需要手动解包。
[mcp_servers.agent_document]
command = 'D:\Apps\AgentDocument\AgentDocument.exe'
args = ['D:\Apps\AgentDocument\resources\app.asar\src\mcp.js']
env = { ELECTRON_RUN_AS_NODE = "1" }
startup_timeout_sec = 30
tool_timeout_sec = 60

# 源码开发方式（二选一，使用时取消注释，并改为你的实际路径）：
# [mcp_servers.agent_document_source]
# command = 'node'
# args = ['D:\Dev\agent-document\src\mcp.js']
